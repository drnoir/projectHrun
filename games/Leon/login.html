<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - HRUN</title>
    <link rel="stylesheet" href="login.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("dungeon image.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            color: white;
        }

        header, nav, main, footer {
            background-color: rgba(0, 0, 0, 0.6); /* semi-transparent for readability */
            padding: 1rem;
        }

        form {
            max-width: 300px;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 10px;
        }

        input, button {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.5rem;
            border: none;
            border-radius: 5px;
        }

        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>HRUN</h1>
    </header>
    <nav>
        <a href="home.html">Home</a>
        <a href="login.html">Login</a>
        <a href="forum.html">Forum</a>
    </nav>
    <main>
        <form>
            <h2>Login</h2>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Enter Realm</button>
        </form>
    </main>
    <footer>
        &copy; 2025 HRUN. All rights reserved.
    </footer>
</body>
</html>
